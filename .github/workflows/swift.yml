name: Build Erosion IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify project
        run: |
          pwd
          echo "=== Airlift ==="
          find . -path "*AirliftFFI*" -type f -print

      - name: Make build script executable
        run: chmod +x ipabuild.sh

      - name: Build IPA
        run: ./ipabuild.sh

      - name: Find IPA
        run: |
          echo "=== IPA files ==="
          find . -type f -name "*.ipa" -print

      - name: Verify IPA exists
        run: |
          if ! find . -type f -name "*.ipa" | grep -q .; then
            echo "ERROR: No IPA was produced!"
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Erosion-IPA
          path: "**/*.ipa"
          if-no-files-found: error
